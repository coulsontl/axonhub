# Builds a personal beta image: upstream `unstable` plus a pull-request branch,
# merged inside the runner at build time.
#
# Nothing is committed back to any branch. The PR branch keeps its own history,
# and this branch never needs to carry the PR's code, so keeping it in sync with
# upstream stays a plain fast-forward.
#
# Images:
#   ghcr.io/coulsontl/axonhub:beta          rolling, multi-arch (use this on servers)
#   ghcr.io/coulsontl/axonhub:beta-<suffix> immutable rollback tag
#
# Trigger: manual only (Actions -> Build beta image -> Run workflow).

name: Build beta image

on:
  workflow_dispatch:
    inputs:
      pr_branch:
        description: 'Pull-request branch to merge on top of upstream unstable'
        required: false
        default: 'fix/anthropic-terminal-usage-with-choices'
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: build-beta
  cancel-in-progress: true

env:
  UPSTREAM_REPO: https://github.com/looplj/axonhub.git
  UPSTREAM_BRANCH: unstable
  IMAGE: ghcr.io/coulsontl/axonhub

jobs:
  prepare:
    name: Validate merge and compute tags
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      upstream_sha: ${{ steps.merge.outputs.upstream_sha }}
      pr_sha: ${{ steps.merge.outputs.pr_sha }}
      base_version: ${{ steps.merge.outputs.base_version }}
      tag_suffix: ${{ steps.merge.outputs.tag_suffix }}
    steps:
      - name: Check out beta branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Merge upstream + PR branch
        id: merge
        env:
          PR_BRANCH: ${{ inputs.pr_branch }}
        run: |
          set -euo pipefail

          git config user.name "axonhub-beta-builder"
          git config user.email "actions@users.noreply.github.com"

          git remote add upstream "$UPSTREAM_REPO"
          git fetch --quiet upstream "+refs/heads/$UPSTREAM_BRANCH:refs/remotes/upstream/$UPSTREAM_BRANCH"
          git fetch --quiet origin "+refs/heads/$PR_BRANCH:refs/remotes/origin/$PR_BRANCH"

          UPSTREAM_SHA=$(git rev-parse upstream/"$UPSTREAM_BRANCH")
          PR_SHA=$(git rev-parse "origin/$PR_BRANCH")

          git checkout --quiet -B build-tree "$UPSTREAM_SHA"
          if ! git merge --no-ff --no-edit "origin/$PR_BRANCH"; then
            echo "::error::origin/$PR_BRANCH does not merge cleanly onto $UPSTREAM_SHA"
            git diff --name-only --diff-filter=U || true
            exit 1
          fi

          BASE_VERSION=$(tr -d '[:space:]' < internal/build/VERSION)
          SUFFIX="$(date -u +%Y%m%d)-pr${PR_SHA:0:7}-r${GITHUB_RUN_NUMBER}"

          {
            echo "upstream_sha=$UPSTREAM_SHA"
            echo "pr_sha=$PR_SHA"
            echo "base_version=$BASE_VERSION"
            echo "tag_suffix=$SUFFIX"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Build plan"
            echo ""
            echo "| item | value |"
            echo "|------|-------|"
            echo "| upstream | \`$UPSTREAM_SHA\` |"
            echo "| PR branch | \`$PR_BRANCH\` @ \`$PR_SHA\` |"
            echo "| version | \`$BASE_VERSION+custom.$SUFFIX\` |"
            echo "| tags | \`:beta\`, \`:beta-$SUFFIX\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build ${{ matrix.arch }}
    needs: [prepare]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Check out beta branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Merge upstream + PR branch
        env:
          PR_BRANCH: ${{ inputs.pr_branch }}
        run: |
          set -euo pipefail

          git config user.name "axonhub-beta-builder"
          git config user.email "actions@users.noreply.github.com"

          git remote add upstream "$UPSTREAM_REPO"
          git fetch --quiet upstream "+refs/heads/$UPSTREAM_BRANCH:refs/remotes/upstream/$UPSTREAM_BRANCH"
          git fetch --quiet origin "+refs/heads/$PR_BRANCH:refs/remotes/origin/$PR_BRANCH"

          git checkout --quiet -B build-tree upstream/"$UPSTREAM_BRANCH"
          git merge --no-ff --no-edit "origin/$PR_BRANCH"

          printf '%s+custom.%s\n' "${{ needs.prepare.outputs.base_version }}" \
            "${{ needs.prepare.outputs.tag_suffix }}" > internal/build/VERSION
          echo "building $(cat internal/build/VERSION) from $(git rev-parse --short HEAD)"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.arch }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ env.IMAGE }}:beta-${{ needs.prepare.outputs.tag_suffix }}-${{ matrix.arch }}
          cache-from: |
            type=gha,scope=axonhub-beta-${{ matrix.arch }}
            type=gha,scope=axonhub-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=axonhub-beta-${{ matrix.arch }}
          provenance: false
          sbom: false

  publish:
    name: Publish multi-arch tags
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest lists
        env:
          SUFFIX: ${{ needs.prepare.outputs.tag_suffix }}
        run: |
          set -euo pipefail

          docker buildx imagetools create \
            -t "$IMAGE:beta" \
            -t "$IMAGE:beta-$SUFFIX" \
            "$IMAGE:beta-$SUFFIX-amd64" \
            "$IMAGE:beta-$SUFFIX-arm64"

          {
            echo "### Published"
            echo ""
            echo '```'
            docker buildx imagetools inspect "$IMAGE:beta"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
